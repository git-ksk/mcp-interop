name: Polish v0.4.0 release docs

on:
  push:
    branches:
      - release/v0.4.0-prep
    paths:
      - .github/workflows/tmp-v040-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.4.0-prep
      - name: Align Copilot research headings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'docs/architecture.md': ('### GitHub Copilot CLI (candidate)', '### GitHub Copilot CLI (research)'),
              'docs/architecture.ja.md': ('### GitHub Copilot CLI (candidate)', '### GitHub Copilot CLI (research)'),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected one heading to replace')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit heading alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture.md docs/architecture.ja.md
          git commit -m 'Align Copilot research documentation headings'
          git push origin HEAD:release/v0.4.0-prep
