name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/mcp-interop

      - name: Real E2E harness checks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bash -n scripts/e2e-real-clients.sh
          bash -n scripts/e2e-cursor-oauth.sh
          bash -n scripts/e2e-antigravity-oauth.sh
          bash -n scripts/poc-vscode-agent-plugin.sh
          bash -n scripts/poc-copilot-cli-mcp.sh
          bash -n scripts/poc-copilot-cli-startup.sh
          go test ./internal/e2e/fixture
          go build ./internal/e2e/fixture

      - name: Tool OAuth fixture release gate
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/e2e/fixture -run '^TestToolOAuthInsufficientScopeReleaseGate$' -count=1

      - name: Release build smoke
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bash scripts/build-release.sh \
            v0.0.0-test \
            0123456789abcdef0123456789abcdef01234567 \
            1970-01-01T00:00:00Z
          test -f dist/mcp-interop_0.0.0-test_darwin_amd64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_darwin_arm64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_linux_amd64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_linux_arm64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_windows_amd64.zip
          test -f dist/mcp-interop_0.0.0-test_windows_arm64.zip
          test -s dist/checksums.txt
          mkdir -p /tmp/mcp-interop-release-smoke
          tar -xzf dist/mcp-interop_0.0.0-test_linux_amd64.tar.gz \
            -C /tmp/mcp-interop-release-smoke
          /tmp/mcp-interop-release-smoke/mcp-interop version | grep -F 'v0.0.0-test'
