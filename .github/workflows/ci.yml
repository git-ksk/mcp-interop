name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  SECURITY_GO_VERSION: 1.26.6
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/mcp-interop

      - name: Set up security scan Go
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.SECURITY_GO_VERSION }}
          cache: false

      - name: Install govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: env GOFLAGS= go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Vulnerability check
        if: matrix.os == 'ubuntu-latest'
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Real E2E harness checks
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bash -n scripts/cli-regression-smoke.sh
          bash -n scripts/e2e-real-clients.sh
          bash -n scripts/guard-real-client-e2e.sh
          bash -n scripts/test-real-client-e2e-guard.sh
          bash -n scripts/test-security-contract.sh
          bash scripts/test-real-client-e2e-guard.sh
          bash scripts/test-security-contract.sh
          bash -n scripts/e2e-cursor-oauth.sh
          bash -n scripts/e2e-antigravity-oauth.sh
          bash -n scripts/poc-vscode-agent-plugin.sh
          bash -n scripts/poc-copilot-cli-mcp.sh
          bash -n scripts/poc-copilot-cli-startup.sh
          go test ./internal/e2e/fixture
          go build ./internal/e2e/fixture

      - name: Tool OAuth fixture release gate
        if: matrix.os == 'ubuntu-latest'
        run: go test ./internal/e2e/fixture -run '^TestToolOAuthInsufficientScopeReleaseGate$' -count=1

  release-artifacts:
    name: build release archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release archives
        shell: bash
        run: |
          bash scripts/build-release.sh v0.0.0-test 0123456789abcdef0123456789abcdef01234567 1970-01-01T00:00:00Z
          test -f dist/mcp-interop_0.0.0-test_darwin_amd64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_darwin_arm64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_linux_amd64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_linux_arm64.tar.gz
          test -f dist/mcp-interop_0.0.0-test_windows_amd64.zip
          test -f dist/mcp-interop_0.0.0-test_windows_arm64.zip
          test -s dist/checksums.txt
      - name: Upload exact release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  native-archive-smoke:
    name: native archive smoke (${{ matrix.label }})
    needs: release-artifacts
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-amd64, os: ubuntu-latest, archive: mcp-interop_0.0.0-test_linux_amd64.tar.gz, binary: mcp-interop }
          - { label: darwin-arm64, os: macos-latest, archive: mcp-interop_0.0.0-test_darwin_arm64.tar.gz, binary: mcp-interop }
          - { label: darwin-amd64, os: macos-15-intel, archive: mcp-interop_0.0.0-test_darwin_amd64.tar.gz, binary: mcp-interop }
          - { label: windows-amd64, os: windows-latest, archive: mcp-interop_0.0.0-test_windows_amd64.zip, binary: mcp-interop.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-release-dist
          path: dist
      - name: Native packaged archive smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p native-smoke
          tar -xzf "dist/${{ matrix.archive }}" -C native-smoke
          bash scripts/native-release-smoke.sh "native-smoke/${{ matrix.binary }}" v0.0.0-test
      - name: Native packaged archive smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath native-smoke
          ./scripts/native-release-smoke.ps1 -Binary "$PWD/native-smoke/${{ matrix.binary }}" -ExpectedVersion v0.0.0-test
