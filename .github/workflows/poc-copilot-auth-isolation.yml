name: Copilot auth-isolation research gate

# Temporary research workflow for PR #70 / issue #48. Remove after observation.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/poc-copilot-auth-isolation.yml
      - scripts/poc-copilot-cli-startup.sh
      - internal/e2e/fixture/**

permissions:
  contents: read

concurrency:
  group: copilot-auth-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted-macos:
    name: hosted macOS safety regression
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/copilot-auth-isolation'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install exact Copilot CLI baseline
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @github/copilot@1.0.80
          copilot --version

      - name: Validate harness syntax
        shell: bash
        run: bash -n scripts/poc-copilot-cli-startup.sh

      - name: Re-run unauthenticated no-model boundary
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/poc-copilot-cli-startup.sh
          rc=$?
          set -e
          if [[ "$rc" -ne 1 ]]; then
            echo "expected unauthenticated research result rc=1, got $rc" >&2
            exit 1
          fi
          echo "unauthenticated boundary remained conservatively NOT READY"

      - name: Prove authenticated mode fails closed without network opt-in
        shell: bash
        run: |
          set -euo pipefail
          marker='github_pat_mcp_interop_fake_secret_marker'
          set +e
          output="$(MCP_INTEROP_COPILOT_TEST_TOKEN="$marker" bash scripts/poc-copilot-cli-startup.sh 2>&1)"
          rc=$?
          set -e
          if [[ "$rc" -ne 2 ]]; then
            echo "expected missing-network-opt-in rc=2, got $rc" >&2
            exit 1
          fi
          if grep -Fq "$marker" <<<"$output"; then
            echo "dedicated test token leaked to output" >&2
            exit 1
          fi
          grep -Fq 'requires MCP_INTEROP_COPILOT_ALLOW_NETWORK=1' <<<"$output"

      - name: Prove authenticated mode refuses retained temporary state
        shell: bash
        run: |
          set -euo pipefail
          marker='github_pat_mcp_interop_fake_secret_marker'
          set +e
          output="$(
            MCP_INTEROP_COPILOT_TEST_TOKEN="$marker" \
            MCP_INTEROP_COPILOT_ALLOW_NETWORK=1 \
            MCP_INTEROP_KEEP_COPILOT_POC_TMP=1 \
            bash scripts/poc-copilot-cli-startup.sh 2>&1
          )"
          rc=$?
          set -e
          if [[ "$rc" -ne 2 ]]; then
            echo "expected retained-state refusal rc=2, got $rc" >&2
            exit 1
          fi
          if grep -Fq "$marker" <<<"$output"; then
            echo "dedicated test token leaked to output" >&2
            exit 1
          fi
          grep -Fq 'does not allow retaining temporary client state' <<<"$output"
