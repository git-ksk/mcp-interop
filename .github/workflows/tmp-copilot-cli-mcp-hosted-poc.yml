name: Copilot CLI MCP Hosted PoC

on:
  push:
    branches:
      - poc/copilot-cli-mcp
    paths:
      - scripts/poc-copilot-cli-mcp.sh
      - scripts/poc-copilot-cli-startup.sh
      - .github/workflows/tmp-copilot-cli-mcp-hosted-poc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-copilot-cli-mcp-poc:
    name: Hosted macOS direct MCP inventory PoC
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install official Copilot CLI package
        shell: bash
        run: npm install -g @github/copilot

      - name: Preflight PoC harnesses
        shell: bash
        run: |
          set -eu
          command -v copilot
          bash -n scripts/poc-copilot-cli-mcp.sh
          bash -n scripts/poc-copilot-cli-startup.sh

      - name: Run terminal MCP management PoC
        id: management
        continue-on-error: true
        shell: bash
        env:
          MCP_INTEROP_KEEP_COPILOT_POC_TMP: "0"
        run: bash scripts/poc-copilot-cli-mcp.sh

      - name: Run no-input PTY startup PoC
        id: startup
        continue-on-error: true
        shell: bash
        env:
          MCP_INTEROP_KEEP_COPILOT_POC_TMP: "0"
        run: bash scripts/poc-copilot-cli-startup.sh

      - name: Evaluate supported no-model boundary
        if: always()
        shell: bash
        run: |
          echo "terminal management outcome: ${{ steps.management.outcome }}"
          echo "no-input startup outcome: ${{ steps.startup.outcome }}"
          if [[ "${{ steps.management.outcome }}" == "success" || "${{ steps.startup.outcome }}" == "success" ]]; then
            exit 0
          fi
          echo "Neither supported no-model Copilot surface proved the MCP lifecycle boundary." >&2
          exit 1
