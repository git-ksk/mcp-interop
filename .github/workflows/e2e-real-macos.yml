name: Real client E2E (macOS)

on:
  workflow_dispatch:
    inputs:
      clients:
        description: Comma-separated real clients to test
        required: true
        default: codex,cursor,antigravity
        type: string

permissions:
  contents: read

concurrency:
  group: real-client-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  real-client-e2e:
    name: real clients (self-hosted macOS arm64)
    runs-on: [self-hosted, macOS, ARM64, mcp-interop-e2e]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Preflight real clients
        shell: bash
        run: |
          set -eu
          command -v codex
          command -v cursor-agent || command -v agent
          command -v agy
          codex --version
          (cursor-agent --version || agent --version)
          agy --version

      - name: Run isolated real-client E2E
        shell: bash
        env:
          MCP_INTEROP_CLIENTS: ${{ inputs.clients }}
        run: bash scripts/e2e-real-clients.sh
