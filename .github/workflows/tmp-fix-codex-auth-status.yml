name: Apply Codex auth-status compatibility fix

on:
  push:
    branches:
      - fix/codex-unknown-auth-with-tools
    paths:
      - .github/workflows/tmp-fix-codex-auth-status.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-unknown-auth-with-tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch conservative unknown-auth interpretation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/adapter/codex/codex.go')
          text = path.read_text(encoding='utf-8')
          old = '''\tdefault:\n\t\tresult.Set(interop.StageAuth, interop.StatusUnknown, "Codex returned an unrecognized authentication state")\n'''
          new = '''\tdefault:\n\t\tif toolCount > 0 {\n\t\t\tresult.Set(interop.StageAuth, interop.StatusPass, "tool discovery completed without an unresolved authentication gate")\n\t\t} else {\n\t\t\tresult.Set(interop.StageAuth, interop.StatusUnknown, "Codex returned an unrecognized authentication state")\n\t\t}\n'''
          if text.count(old) != 1:
              raise SystemExit('codex.go: expected exactly one default auth-status block')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test_path = Path('internal/adapter/codex/codex_test.go')
          test_text = test_path.read_text(encoding='utf-8')
          marker = '''func TestInterpretStatusDoesNotTreatEmptyInventoryAsSuccess(t *testing.T) {\n'''
          addition = '''func TestInterpretStatusUnknownAuthWithToolsProvesNoUnresolvedAuthGate(t *testing.T) {\n\tresult := interop.NewResult(clientID, clientName, "codex-cli test", "https://example.com/mcp")\n\tinterpretStatus(&result, serverStatus{\n\t\tName:       testServerName,\n\t\tAuthStatus: "newFutureState",\n\t\tTools: map[string]json.RawMessage{\n\t\t\t"ping": json.RawMessage(`{"name":"ping"}`),\n\t\t},\n\t})\n\n\tassertStage(t, result, interop.StageReach, interop.StatusPass)\n\tassertStage(t, result, interop.StageAuth, interop.StatusPass)\n\tassertStage(t, result, interop.StageInit, interop.StatusPass)\n\tassertStage(t, result, interop.StageTools, interop.StatusPass)\n}\n\nfunc TestInterpretStatusUnknownAuthWithoutToolsRemainsUnknown(t *testing.T) {\n\tresult := interop.NewResult(clientID, clientName, "codex-cli test", "https://example.com/mcp")\n\tinterpretStatus(&result, serverStatus{\n\t\tName:       testServerName,\n\t\tAuthStatus: "newFutureState",\n\t\tTools:      map[string]json.RawMessage{},\n\t})\n\n\tassertStage(t, result, interop.StageReach, interop.StatusUnknown)\n\tassertStage(t, result, interop.StageAuth, interop.StatusUnknown)\n\tassertStage(t, result, interop.StageInit, interop.StatusUnknown)\n\tassertStage(t, result, interop.StageTools, interop.StatusUnknown)\n}\n\n'''
          if test_text.count(marker) != 1:
              raise SystemExit('codex_test.go: expected one insertion marker')
          test_path.write_text(test_text.replace(marker, addition + marker), encoding='utf-8')
          PY
          gofmt -w internal/adapter/codex/codex.go internal/adapter/codex/codex_test.go
          git diff --check
      - name: Test Codex adapter
        run: go test ./internal/adapter/codex -count=1
      - name: Test all
        run: go test ./...
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapter/codex/codex.go internal/adapter/codex/codex_test.go
          git commit -m 'Handle unknown Codex auth state after tool discovery'
          git push origin HEAD:fix/codex-unknown-auth-with-tools
