name: Copilot CLI 1.0.80 research PoC

on:
  pull_request:
    paths:
      - .github/workflows/poc-copilot-cli-1.0.80.yml
      - scripts/poc-copilot-cli-mcp.sh
      - scripts/poc-copilot-cli-startup.sh
      - internal/e2e/fixture/**

permissions:
  contents: read

concurrency:
  group: copilot-cli-1-0-80-poc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  copilot-cli-1-0-80:
    name: hosted macOS no-model PoC
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'poc/copilot-cli-1.0.80-refresh'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install exact Copilot CLI baseline
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @github/copilot@1.0.80
          copilot --version

      - name: Validate PoC harness syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/poc-copilot-cli-mcp.sh
          bash -n scripts/poc-copilot-cli-startup.sh

      - name: Characterize terminal MCP management surface
        id: management
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/poc-copilot-cli-mcp.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "terminal-management PoC exit=$rc"
          exit 0

      - name: Test no-input real Copilot startup
        id: startup
        shell: bash
        run: |
          set -uo pipefail
          set +e
          bash scripts/poc-copilot-cli-startup.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "no-input startup PoC exit=$rc"
          exit 0

      - name: Research verdict
        shell: bash
        env:
          MANAGEMENT_RC: ${{ steps.management.outputs.rc }}
          STARTUP_RC: ${{ steps.startup.outputs.rc }}
        run: |
          set -euo pipefail
          echo "terminal management rc=${MANAGEMENT_RC}"
          echo "no-input startup rc=${STARTUP_RC}"
          if [[ "${STARTUP_RC}" == "0" ]]; then
            echo "OBSERVED: Copilot CLI 1.0.80 reached tools/list during no-input real-client startup."
          else
            echo "OBSERVED: Copilot CLI 1.0.80 still did not prove tools/list under the no-model isolated-state contract."
          fi
          echo "This temporary research workflow intentionally exits successfully for either observation."
