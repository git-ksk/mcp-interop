name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  RELEASE_GO_VERSION: 1.26.6
  GOVULNCHECK_VERSION: v1.6.0

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and provenance
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not contained in origin/main" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache: true

      - name: Format source
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet source
        run: go vet ./...

      - name: Test source
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Install govulncheck
        run: env GOFLAGS= go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Vulnerability check
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Shell syntax gates
        shell: bash
        run: |
          bash -n scripts/build-release.sh
          bash -n scripts/cli-regression-smoke.sh
          bash -n scripts/e2e-real-clients.sh
          bash -n scripts/guard-real-client-e2e.sh
          bash -n scripts/test-real-client-e2e-guard.sh
          bash -n scripts/test-security-contract.sh
          bash -n scripts/e2e-cursor-oauth.sh
          bash -n scripts/e2e-antigravity-oauth.sh
          bash -n scripts/poc-vscode-agent-plugin.sh
          bash -n scripts/poc-copilot-cli-mcp.sh
          bash -n scripts/poc-copilot-cli-startup.sh

      - name: Self-hosted real-client trust guard gate
        shell: bash
        run: bash scripts/test-real-client-e2e-guard.sh

      - name: Security contract gate
        shell: bash
        run: bash scripts/test-security-contract.sh

      - name: Tool OAuth fixture release gate
        run: go test ./internal/e2e/fixture -run '^TestToolOAuthInsufficientScopeReleaseGate$' -count=1

      - name: Build release archives
        shell: bash
        run: |
          bash scripts/build-release.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify embedded version and CLI regression smoke
        shell: bash
        run: |
          mkdir -p /tmp/mcp-interop-release-check
          tar -xzf "dist/mcp-interop_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz" \
            -C /tmp/mcp-interop-release-check
          /tmp/mcp-interop-release-check/mcp-interop version | grep -F "$GITHUB_REF_NAME"
          bash scripts/cli-regression-smoke.sh /tmp/mcp-interop-release-check/mcp-interop

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
