name: Temporary diagnose metadata hardening

on:
  push:
    branches:
      - fix/diagnose-oauth-metadata-hardening
    paths:
      - scripts/tmp_diagnose_hardening.py
      - .github/workflows/tmp-diagnose-hardening.yml

permissions:
  contents: write

concurrency:
  group: tmp-diagnose-hardening
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/diagnose-oauth-metadata-hardening

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply exact source patch
        run: python3 scripts/tmp_diagnose_hardening.py

      - name: Format and verify focused packages
        run: |
          gofmt -w internal/diagnose/chatgpt.go internal/diagnose/chatgpt_test.go internal/interop/auth_enrichment.go internal/interop/auth_enrichment_test.go internal/interop/auth_network.go
          go test ./internal/interop ./internal/diagnose

      - name: Remove one-shot scaffolding
        run: rm -f scripts/tmp_diagnose_hardening.py .github/workflows/tmp-diagnose-hardening.yml

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden diagnose OAuth metadata handling'
          git push origin HEAD:fix/diagnose-oauth-metadata-hardening
