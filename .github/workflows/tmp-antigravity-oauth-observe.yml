name: Temporary Antigravity OAuth Observe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Probe isolated MCP manager
        shell: bash
        run: |
          set -eu
          work="$(mktemp -d)"
          trap 'kill "${fixture_pid:-}" 2>/dev/null || true; rm -rf "$work"' EXIT
          go build -o "$work/oauth-fixture" ./internal/e2e/oauthfixture
          "$work/oauth-fixture" --listen 127.0.0.1:0 --ready-file "$work/ready" --log-file "$work/trace" &
          fixture_pid=$!
          for _ in {1..100}; do [[ -s "$work/ready" ]] && break; sleep 0.05; done
          endpoint="$(tr -d '\r\n' < "$work/ready")"
          probehome="$work/home"
          mkdir -p "$probehome/.gemini/config" "$probehome/.gemini/antigravity-cli"
          python3 - "$endpoint" "$probehome/.gemini/config/mcp_config.json" <<'PY'
          import json,sys
          endpoint,path=sys.argv[1:]
          with open(path,'w') as f:
              json.dump({'mcpServers':{'mcp-interop-target':{'serverUrl':endpoint}}},f)
          PY
          printf '%s\n' '{"altScreenMode":"never","showTips":false,"showFeedbackSurvey":false}' > "$probehome/.gemini/antigravity-cli/settings.json"
          set +e
          (
            sleep 4
            printf '/mcp\r'
            sleep 4
            printf '\r'
            sleep 3
          ) | HOME="$probehome" perl -e '$t=shift; alarm $t; exec @ARGV' 15 /usr/bin/script -q "$work/transcript" "$(command -v agy)" >/dev/null 2>&1
          set -e
          echo "--- secret-safe MCP manager indicators ---"
          python3 - "$work/transcript" <<'PY'
          import re,sys
          data=open(sys.argv[1],'rb').read().decode('utf-8','ignore')
          data=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',data)
          data=re.sub(r'https?://\S+','[URL]',data)
          data=re.sub(r'\b[A-Za-z0-9_-]{24,}\b','[LONG_VALUE]',data)
          for line in data.splitlines():
              low=line.lower()
              if any(k in low for k in ('mcp-interop-target','authenticate','oauth','authentication','mcp server','mcp manager')):
                  print(line[:500])
          PY
          echo "--- secret-free fixture trace ---"
          cat "$work/trace" || true
