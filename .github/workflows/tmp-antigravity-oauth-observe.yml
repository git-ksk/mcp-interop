name: Temporary Antigravity OAuth Observe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Drive isolated MCP OAuth flow
        shell: bash
        run: |
          set -u
          work="$(mktemp -d)"
          trap 'kill "${fixture_pid:-}" "${agy_pid:-}" "${watch_pid:-}" 2>/dev/null || true; rm -rf "$work"' EXIT
          go build -o "$work/oauth-fixture" ./internal/e2e/oauthfixture || exit 1
          "$work/oauth-fixture" --listen 127.0.0.1:0 --ready-file "$work/ready" --log-file "$work/trace" &
          fixture_pid=$!
          for _ in {1..100}; do [[ -s "$work/ready" ]] && break; sleep 0.05; done
          endpoint="$(tr -d '\r\n' < "$work/ready")"
          origin="${endpoint%/mcp}"
          probehome="$work/home"
          mkdir -p "$probehome/.gemini/config" "$probehome/.gemini/antigravity-cli"
          python3 - "$endpoint" "$probehome/.gemini/config/mcp_config.json" <<'PY'
          import json,sys
          endpoint,path=sys.argv[1:]
          with open(path,'w') as f:
              json.dump({'mcpServers':{'mcp-interop-target':{'serverUrl':endpoint}}},f)
          PY
          printf '%s\n' '{"altScreenMode":"never","showTips":false,"showFeedbackSurvey":false}' > "$probehome/.gemini/antigravity-cli/settings.json"

          auth_url_file="$work/auth-url"
          (
            for _ in {1..2500}; do
              /bin/ps -axo command= 2>/dev/null | python3 - "$origin" "$auth_url_file" <<'PY'
          import os,re,sys,urllib.parse
          origin,out=sys.argv[1:]
          expected=urllib.parse.urlparse(origin)
          data=sys.stdin.read()
          for raw in re.findall(r'https?://[^\s<>"\']+',data):
              raw=raw.rstrip(').,;]}')
              u=urllib.parse.urlparse(raw)
              if u.scheme=='http' and u.hostname==expected.hostname and u.port==expected.port and u.path=='/authorize':
                  if not os.path.exists(out):
                      fd=os.open(out,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                      with os.fdopen(fd,'w') as f: f.write(raw)
                  raise SystemExit(0)
          PY
              [[ -s "$auth_url_file" ]] && exit 0
              sleep 0.01
            done
          ) &
          watch_pid=$!

          mkfifo "$work/input"
          HOME="$probehome" perl -e '$t=shift; alarm $t; exec @ARGV' 35 \
            /usr/bin/script -q "$work/transcript" "$(command -v agy)" < "$work/input" >/dev/null 2>&1 &
          agy_pid=$!
          exec 3> "$work/input"
          sleep 4
          printf '/mcp\r' >&3 || true
          sleep 4
          printf '\r' >&3 || true
          for _ in {1..150}; do [[ -s "$auth_url_file" ]] && break; sleep 0.1; done

          code_file="$work/auth-code"
          marker="$work/marker"
          if [[ -s "$auth_url_file" ]]; then
            python3 - "$auth_url_file" "$origin" "$code_file" "$marker" <<'PY'
          import os,sys,urllib.error,urllib.parse,urllib.request
          url_path,origin,code_path,marker_path=sys.argv[1:]
          raw=open(url_path).read()
          u=urllib.parse.urlparse(raw); expected=urllib.parse.urlparse(origin)
          if u.scheme!='http' or u.hostname!=expected.hostname or u.port!=expected.port or u.path!='/authorize':
              raise SystemExit(65)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect)
          try:
              resp=opener.open(raw,timeout=15); status=resp.status; location=resp.headers.get('Location','')
          except urllib.error.HTTPError as e:
              status=e.code; location=e.headers.get('Location','')
          code=urllib.parse.parse_qs(urllib.parse.urlparse(location).query).get('code',[''])[0]
          with open(marker_path,'w') as f:
              f.write(f'authorization_launch_observed=true\nauthorize_status={status}\ncode_observed={bool(code)}\n')
          if code:
              fd=os.open(code_path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
              with os.fdopen(fd,'w') as f: f.write(code)
          PY
          else
            printf '%s\n' 'authorization_launch_observed=false' > "$marker"
          fi

          if [[ -s "$code_file" ]]; then
            cat "$code_file" >&3 || true
            printf '\r' >&3 || true
            sleep 8
          fi
          exec 3>&-
          kill "$agy_pid" "$watch_pid" 2>/dev/null || true
          wait "$agy_pid" 2>/dev/null || true
          wait "$watch_pid" 2>/dev/null || true

          echo "--- OAuth observation (secret-free) ---"
          cat "$marker"
          token_file="$probehome/.gemini/antigravity/mcp_oauth_tokens.json"
          if [[ -s "$token_file" ]]; then echo "isolated_token_file=present"; else echo "isolated_token_file=absent"; fi
          echo "--- secret-free fixture trace ---"
          cat "$work/trace" || true
